[project]
name = "sci"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.5",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "joblib==1.6.0",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "httpx==0.28.1",
    "langgraph-checkpoint-postgres==3.2.0",
]

[project.scripts]
db-migrate = "app.migrate:main"
db-seed = "app.pipeline:main"
assistant = "app.assistant.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
