name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sci
          POSTGRES_PASSWORD: sci
          POSTGRES_DB: sci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sci -d sci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://sci:sci@localhost:5432/sci

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sci:ci .
