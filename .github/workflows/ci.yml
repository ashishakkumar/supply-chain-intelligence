name: ci

on:
  push: # when you push to the branch
  pull_request: # when you create a pull request
    branches:
   
jobs: # jobs are the steps you want to run
  test:
    runs-on: ubuntu-latest # the operating system you want to use
    services: # the services you want to use
      postgres:
        image: postgres:16 # the image you want to use
        env:
          POSTGRES_USER: sci # the username you want to use
          POSTGRES_PASSWORD: sci # the password you want to use
          POSTGRES_DB: sci # the database you want to use 
        ports:
          - 5432:5432 # the port you want to use
        options: >-
          --health-cmd "pg_isready -U sci -d sci" 
          --health-interval 2s
          --health-timeout 5s 
          --health-retries 30 
    steps:
      - uses: actions/checkout@v4 # the checkout action
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.13"
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check app tests
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://sci:sci@localhost:5432/sci # the database url
  image:
    runs-on: ubuntu-latest # the operating system you want to use
    steps:
      - uses: actions/checkout@v4 # the checkout action
      - run: docker build -t sci:ci . # the build action